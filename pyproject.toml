[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puf-snn"
version = "0.1.0"
description = "Software prototype for authenticated Quest motion inference."
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "numpy>=2.0,<3.0",
    "scikit-learn>=1.5,<2.0",
    "matplotlib>=3.9,<4.0",
    "jsonschema>=4.23,<5.0",
    "galois==0.4.11"
]

# find the shared puf_snn package inside src/python
[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["puf_snn*"]
